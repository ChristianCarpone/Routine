<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Routine</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#ececf1;--text:#111114;--muted:#6e6e78;--line:rgba(0,0,0,.08);
  --acc:#5856d6;--gym:#5856d6;--run:#ff6b3d;--bike:#1fae74;--other:#e0a100;
  --inc:#1fae74;--exp:#e5484d;--p:#4f8ef7;--c:#f0a43a;--f:#d6589a;--water:#2f9bff;--segon:#fff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1a1a1f;--card2:#2a2a31;--text:#f3f3f6;--muted:#9c9ca8;--line:rgba(255,255,255,.09);
  --acc:#7d7bff;--gym:#7d7bff;--run:#ff7d52;--bike:#2fc488;--other:#f2b62b;
  --inc:#2fc488;--exp:#ff5f63;--p:#6aa2ff;--c:#f5b44f;--f:#e772ad;--water:#4aa8ff;--segon:#45454e;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
header.top h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.02em}
.addBtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:7px 2px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.card .item{background:var(--card2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;min-width:0}
.stat small{color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.stat b{font-size:21px;font-weight:700;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3 .stat b{font-size:15px;white-space:normal;overflow:visible}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.hero small{color:var(--muted);font-size:13px;display:block}.hero b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month-nav h3{margin:0;font-size:17px;font-weight:700;text-transform:capitalize}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:20px;line-height:1;padding:0 0 2px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px;font-weight:600}
.day{aspect-ratio:1/1;border:0;background:none;border-radius:50%;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0}
.day.out{opacity:.28}.day.has span{font-weight:700}
.day.today span{color:var(--acc);font-weight:800}
.day.sel{background:var(--acc)}.day.sel span{color:#fff}
.dots{display:flex;gap:2px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.day.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;gap:10px}
.section-h h3{margin:0;font-size:18px;font-weight:700}
.section-h h3::first-letter{text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:14px;margin-bottom:8px;width:100%;border:0;color:inherit;text-align:left}
.item .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:14px}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600}
.item .t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .r{font-weight:600;white-space:nowrap}
.btn{border:0;background:var(--acc);color:#fff;padding:13px 16px;border-radius:12px;font-weight:600;font-size:15px;width:100%;display:block}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;display:inline-block}
.btn.ghost{background:var(--card2);color:var(--acc)}
.btn.danger{background:none;color:var(--exp);margin-top:14px}
.btn+.btn{margin-top:8px}.btn.sm+.btn.sm{margin-top:0}
.empty{color:var(--muted);text-align:center;padding:22px 12px;font-size:14px;background:var(--card);border-radius:14px;margin-bottom:8px}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.catrow{padding:10px 0;border-bottom:1px solid var(--line)}.catrow:last-child{border:0;padding-bottom:2px}.catrow:first-child{padding-top:2px}
.catrow .l{display:flex;justify-content:space-between;margin-bottom:6px;font-size:15px;gap:8px}
.catrow .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.row:last-child{border-bottom:0}.row>span:last-child{font-weight:600;text-align:right}
button.row{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left}
button.row:last-child{border-bottom:0}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{font-size:9px;fill:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.stepper{display:flex;align-items:center;gap:14px}.stepper b{font-size:22px;min-width:26px;text-align:center}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:118px;flex:none}.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ringlbl{position:relative;width:118px;flex:none}.ringlbl div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringlbl b{font-size:22px;font-weight:800}.ringlbl small{font-size:11px;color:var(--muted)}
.macros{flex:1;min-width:0}
.macro{margin-bottom:10px}.macro:last-child{margin-bottom:0}.macro .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;gap:8px}
.meal .mh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.meal .mh>div:first-child{flex:1}
.meal .mh b{font-size:16px}.meal .mh span{color:var(--muted);font-size:14px;margin-left:6px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;text-align:left;font-size:15px}
.fi small{display:block;color:var(--muted);font-size:12px}
.fi .k{white-space:nowrap;font-weight:600}
.plus{width:30px;height:30px;border-radius:50%;border:0;background:var(--card2);color:var(--acc);font-size:19px;line-height:1;padding:0 0 2px;flex:none}
.plus.star{font-size:15px;padding:0}
.note{font-size:13px;color:var(--muted);margin:6px 4px 12px}
.banner{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.card-h b{font-size:17px}.card-h>span{font-size:13px;color:var(--muted)}
.cardlink{display:block;width:100%;text-align:left;border:0;color:inherit}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{background:var(--card);border:0;border-radius:14px;padding:12px 2px 10px;color:var(--text);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;font-weight:800}
.weekdots{display:flex;justify-content:space-between;margin-top:10px}
.weekdots div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.weekdots i{width:26px;height:26px;border-radius:50%;background:var(--card2);display:block}
.weekdots .t{color:var(--acc);font-weight:700}
.water{display:flex;align-items:center;gap:8px;margin-top:12px}
.water>div{flex:1;min-width:0}
/* esercizi e serie */
.exc{background:var(--card);border-radius:14px;padding:8px 12px 12px;margin-bottom:10px}
.exc-h{display:flex;gap:8px;align-items:center}
.exc-h input{font-weight:700;border:0;background:transparent;padding:8px 0;font-size:17px}
.exc .hint{font-size:12px;color:var(--muted);margin:-2px 0 8px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:6px;align-items:center;margin-bottom:6px}
.setrow.head{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:4px;text-align:center}
.setrow .sn{text-align:center;font-weight:700;color:var(--muted)}
.setrow input{text-align:center;padding:9px 6px;background:var(--bg)}
.setrow.ok input{border-color:color-mix(in srgb,var(--inc) 55%,transparent)}
.tick{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:18px;font-weight:800}
.tick.on{background:var(--inc);border-color:var(--inc);color:#fff}
.setbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.setbtns label{margin-left:auto;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.setbtns label input{width:62px;padding:7px;text-align:center}
/* timer */
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:30;background:#1c1c22;color:#fff;border-radius:30px;padding:7px 7px 7px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
#timer[hidden]{display:none}
#timer small{display:block;font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
#timer b{display:block;font-size:22px;font-variant-numeric:tabular-nums;min-width:62px;line-height:1.1}
#timer button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:20px;padding:8px 11px;font-size:14px;font-weight:600}
#timer.done{background:var(--inc)}
body.timer-on .sb{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
/* scanner */
#scan{position:fixed;inset:0;z-index:45;background:#000;display:flex;flex-direction:column}
#scan[hidden]{display:none}
#scan .vw{position:relative;flex:1;min-height:0;overflow:hidden}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scan .guide{position:absolute;left:8%;right:8%;top:36%;height:20%;border:3px solid rgba(255,255,255,.95);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
#scan .top{position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px;right:16px;color:#fff;text-align:center;font-weight:600;text-shadow:0 1px 3px #000}
#scan .sbar{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;gap:8px;align-items:center}
#scan .sbar input{background:#222;color:#fff;border-color:#333}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .2s}
.sheet .panel{position:relative;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);width:100%;max-width:640px;margin:0 auto}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}
.sh button{background:none;border:0;color:var(--acc);font-size:16px;padding:0;min-width:64px;text-align:left}
.sh button.save{font-weight:700;text-align:right}
.sh b{font-size:16px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none;margin:0}
input[type=date]{min-height:45px;display:block}
input[type=checkbox]{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto;flex:none;margin:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:64px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;margin:4px 4px 14px;font-size:15px}
.exhead,.exrow{display:grid;grid-template-columns:1fr 42px 50px 54px 50px 22px;gap:4px;align-items:center}
.exhead{font-size:10px;color:var(--muted);padding:0 2px 4px;font-weight:600;text-transform:uppercase;text-align:center}
.exhead span:first-child{text-align:left;padding-left:6px}
.exrow{margin-bottom:6px}.exrow input{padding:10px 4px;text-align:center}.exrow input:first-child{text-align:left;padding-left:10px}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:0;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.amount{font-size:34px !important;font-weight:700;text-align:center;padding:14px !important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live{font-size:14px;color:var(--acc);margin:-4px 4px 12px;font-weight:600;min-height:1px}
.res .fi:first-child{border-top:0}
.src{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:600}
.picked{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.picked b{font-size:17px;display:block}
.totals{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--card);border-radius:14px;padding:12px 6px;margin-bottom:14px}
.totals b{display:block;font-size:18px}.totals small{font-size:11px;color:var(--muted)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:14px 2px 4px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,34,.94);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
</style>
</head>
<body>
<header class="top"><h1 id="title">Routine</h1><button class="addBtn" id="addBtn" aria-label="Aggiungi">+</button></header>
<main id="view"></main>
<nav class="tabbar">
  <button data-a="tab" data-v="today"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.5 2.5 4.5-4.5"/></svg>Oggi</button>
  <button data-a="tab" data-v="train"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Allenamento</button>
  <button data-a="tab" data-v="fin"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg>Risparmi</button>
  <button data-a="tab" data-v="diet"><svg viewBox="0 0 24 24"><path d="M12 7c-2-2.5-7-2-7 3.5 0 4.5 3.5 9.5 7 9.5s7-5 7-9.5C19 5 14 4.5 12 7z"/><path d="M12 7c0-2 1-3.5 3-4"/></svg>Dieta</button>
  <button data-a="tab" data-v="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Altro</button>
</nav>
<div class="sheet" id="sheet" hidden>
  <div class="bd" id="shBd"></div>
  <div class="panel">
    <div class="sh"><button id="shCancel">Annulla</button><b id="shTitle"></b><button class="save" id="shSave">Salva</button></div>
    <div class="sb" id="shBody"></div>
  </div>
</div>
<div id="timer" hidden><div><small id="tmL">recupero</small><b id="tmT">1:30</b></div><button id="tmM">−15</button><button id="tmP">+15</button><button id="tmX" aria-label="Chiudi timer">✕</button></div>
<div id="scan" hidden>
  <div class="vw"><video id="scanVid" playsinline muted autoplay></video><div class="guide"></div><div class="top" id="scanMsg">Inquadra il codice a barre</div></div>
  <div class="sbar"><input id="scanCode" inputmode="numeric" placeholder="oppure scrivi il codice" autocomplete="off"><button class="btn sm" id="scanGo">Cerca</button><button class="btn sm ghost" id="scanX">Annulla</button></div>
</div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="gpxFile" hidden>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= utility ================= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parseYmd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d||1)};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};

function merge(base,d){
  if(!d||typeof d!=='object'||Array.isArray(d))return d===undefined?base:d;
  const o={...base};
  for(const k in d){o[k]=(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))?merge(base[k],d[k]):d[k]}
  return o;
}

function migrate(s){
  s.plans.forEach(p=>(p.ex||[]).forEach(e=>{if(e.rest==null||e.rest==='')e.rest=90}));
  s.workouts.forEach(w=>{
    if(!Array.isArray(w.ex))w.ex=[];
    w.ex.forEach(e=>{
      if(!Array.isArray(e.s)){const n=Math.min(12,Math.max(1,Math.round(pn(e.sets))||1));e.s=Array.from({length:n},()=>({r:String(e.reps??''),kg:String(e.kg??''),ok:true}))}
      if(e.rest==null)e.rest=90;delete e.sets;delete e.reps;delete e.kg;
    });
  });
  (s.fin.rec||[]).forEach(r=>{if(!Array.isArray(r.done))r.done=[]});
  s.v=2;return s;
}

function lineChart(series,fmt){
  series=series.map(s=>({...s,pts:[...s.pts].sort((a,b)=>a.x-b.x)}));
  const all=series.flatMap(s=>s.pts);
  if(all.length<2)return '<div class="small muted" style="padding:10px 0">Servono almeno due registrazioni per vedere il grafico.</div>';
  const W=320,H=150,pl=36,pr=8,pt=10,pb=18;
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x1===x0){x0-=864e5;x1+=864e5}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const py=(y1-y0)*.18||Math.max(1,Math.abs(y1)*.03);y0-=py;y1+=py;
  const X=x=>pl+(x-x0)/(x1-x0)*(W-pl-pr),Y=y=>pt+(1-(y-y0)/(y1-y0))*(H-pt-pb);
  let s='';
  [.12,.5,.88].forEach(f=>{const v=y0+(y1-y0)*f,yy=Y(v).toFixed(1);s+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${pl-5}" y="${(+yy+3).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`});
  const dl=x=>{const d=new Date(x);return `${d.getDate()}/${d.getMonth()+1}`};
  s+=`<text x="${pl}" y="${H-4}">${dl(x0)}</text><text x="${W-pr}" y="${H-4}" text-anchor="end">${dl(x1)}</text>`;
  series.forEach(se=>{if(!se.pts.length)return;
    s+=`<path d="${se.pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')}" style="fill:none;stroke:${se.color};stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round${se.dash?';stroke-dasharray:4 4':''}"/>`;
    if(se.pts.length<=40)se.pts.forEach(p=>{s+=`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.8" style="fill:${se.color}"/>`});
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function ringSvg(val,goal){
  const r=50,c=2*Math.PI*r,p=goal?Math.min(val/goal,1):0,over=goal&&val>goal;
  return `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" style="stroke:var(--card2)"/>${p>0?`<circle cx="60" cy="60" r="${r}" transform="rotate(-90 60 60)" style="stroke:${over?'var(--exp)':'var(--run)'};stroke-dasharray:${(c*p).toFixed(1)} ${c.toFixed(1)}"/>`:''}</svg>`;
}

function bodySorted(){return [...S.body.log].sort((a,b)=>a.date.localeCompare(b.date))}
function bodyKg(date){const l=bodySorted();let w=null;for(const e of l){if(e.date<=date)w=pn(e.kg)}if(w==null&&l.length)w=pn(l[0].kg);return w||pn(S.meta.defKg)||75}

/* ---- stime kcal ----
   con frequenza cardiaca: formula di Keytel (2005), servono sesso ed età
   corsa: circa 1 kcal per kg per "km sforzo" (km + dislivello/100)
   bici: modello fisico (rotolamento + aria + salita) con rendimento muscolare 24% + metabolismo a riposo
   sala pesi e altro: MET x peso x ore */
function age(){const y=pn(S.profile.birthYear);return y>1900?new Date().getFullYear()-y:0}
function hrKcal(w,kg){const hr=pn(w.hr),mn=pn(w.min),a=age(),sx=S.profile.sex;if(!hr||!mn||!a||!sx)return 0;
  const k=sx==='F'?(-20.4022+.4472*hr-.1263*kg+.074*a):(-55.0969+.6309*hr+.1988*kg+.2017*a);return Math.max(0,k/4.184*mn)}
const BK={crr:.005,cda:.35,rho:1.2,g:9.81,eff:.24};
function bikeMech(w,kg){const km=pn(w.km),mn=pn(w.min),el=pn(w.elev),m=kg+(pn(S.profile.bikeKg)||10),d=km*1000;if(!km||!mn)return null;const v=d/(mn*60);
  const flat=BK.crr*m*BK.g+.5*BK.rho*BK.cda*v*v;return{E:flat*d+m*BK.g*el,flat,v}}
function effortKm(w,kg){const km=pn(w.km),el=pn(w.elev);if(!km)return 0;if(w.type==='bike'){const b=bikeMech(w,kg||bodyKg(w.date));return b?b.E/b.flat/1000:km}return km+el/100}
function burn(w){
  const kg=bodyKg(w.date),mn=pn(w.min),km=pn(w.km),el=pn(w.elev);
  const h=hrKcal(w,kg);if(h)return h;
  const climb=kg*BK.g*el/.25/4184;
  if(w.type==='run'){if(km)return kg*(km+el/100);return mn?9.8*kg*mn/60:0}
  if(w.type==='bike'){const b=bikeMech(w,kg);if(b)return b.E/BK.eff/4184+kg*mn/60;if(km)return kg*km*.3+climb;return mn?7*kg*mn/60:0}
  if(w.type==='gym'){const m=mn||(w.ex||[]).reduce((a,e)=>a+e.s.length,0)*2.5;return 5*kg*m/60}
  return (mn?5*kg*mn/60:0)+climb;
}
function dayBurn(date){return S.workouts.filter(w=>w.date===date).reduce((a,w)=>a+burn(w),0)}
function goalFor(date){const G=S.diet.goal,train=S.workouts.some(w=>w.date===date),b=dayBurn(date);let k=train&&pn(G.kcalT)?pn(G.kcalT):(pn(G.kcal)||2000);if(G.addBurn)k+=b;return{kcal:Math.round(k),train,burn:b}}
const tot=(per,g)=>({kcal:per.k*g/100,p:per.p*g/100,c:per.c*g/100,f:per.f*g/100});

function sums(list){let inc=0,exp=0;const cats={},icats={};list.forEach(t=>{if(t.type==='inc'){inc+=t.amt;icats[t.cat]=(icats[t.cat]||0)+t.amt}else{exp+=t.amt;cats[t.cat]=(cats[t.cat]||0)+t.amt}});return{inc,exp,cats,icats}}
function catColor(c){let i=S.fin.expCats.indexOf(c);if(i<0)i=S.fin.expCats.length+[...String(c)].reduce((a,ch)=>a+ch.charCodeAt(0),0);return PALETTE[i%PALETTE.length]}
function completeMonths(n){const firstM=S.fin.tx.map(t=>t.date.slice(0,7)).sort()[0];if(!firstM)return[];const now=new Date(),out=[];for(let i=n;i>=1;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1),k=monthKey(d.getFullYear(),d.getMonth());if(k>=firstM)out.push(k)}return out}
function avgSaving(){let m=completeMonths(3);if(!m.length)m=[today().slice(0,7)];const t=m.map(k=>sums(txMonth(k)));return t.reduce((a,x)=>a+x.inc-x.exp,0)/m.length}
function recDate(r,y,m){return `${monthKey(y,m)}-${pad(Math.min(r.day,daysInMonth(y,m)))}`}
function applyRecurring(){
  const t=today(),cur=t.slice(0,7);let n=0;
  S.fin.rec.forEach(r=>{let[y,m]=r.from.split('-').map(Number);m-=1;
    for(let g=0;g<240;g++){const mk=monthKey(y,m);if(mk>cur)break;
      if(!r.done.includes(mk)){const k=recDate(r,y,m);if(k<=t){S.fin.tx.push({id:uid(),type:r.type,amt:r.amt,cat:r.cat,date:k,note:r.note||'',ts:Date.now(),recId:r.id});r.done.push(mk);n++}}
      m++;if(m>11){m=0;y++}}});
  if(n){save();toast(n===1?'Aggiunto 1 movimento ricorrente':`Aggiunti ${n} movimenti ricorrenti`)}
  return n;
}
function upcomingRec(days){
  const t=today(),lim=ymd(addDays(new Date(),days)),now=new Date(),out=[];
  S.fin.rec.forEach(r=>{for(let i=0;i<2;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1),mk=monthKey(d.getFullYear(),d.getMonth());if(mk<r.from||r.done.includes(mk))continue;const k=recDate(r,d.getFullYear(),d.getMonth());if(k>t&&k<=lim){out.push({r,k});break}}});
  return out.sort((a,b)=>a.k.localeCompare(b.k));
}

function wByDate(){const m={};S.workouts.forEach(w=>(m[w.date]||(m[w.date]=[])).push(w));return m}
function sortedW(){return [...S.workouts].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0))}
function suggestNextPlan(){
  if(!S.plans.length)return null;
  const g=sortedW().find(w=>w.type==='gym'&&w.planId&&S.plans.some(p=>p.id===w.planId));
  if(!g)return S.plans[0];
  const i=S.plans.findIndex(p=>p.id===g.planId);return S.plans[(i+1)%S.plans.length];
}
function weekCount(){const ws=weekStart(new Date()),k=ymd(ws),e=ymd(addDays(ws,7));return S.workouts.filter(w=>w.date>=k&&w.date<e).length}
function wSummary(w){
  const kc=burn(w),kt=kc?` · ≈ ${num(kc)} kcal`:'';
  if(w.type==='gym'){const p=S.plans.find(p=>p.id===w.planId),tt=w.ex.reduce((a,e)=>a+e.s.length,0),dn=w.ex.reduce((a,e)=>a+e.s.filter(s=>s.ok).length,0);
    return{title:p?p.name:'Sala pesi',sub:[`${w.ex.length} esercizi · ${dn}/${tt} serie`,w.min?fmtMin(pn(w.min)):''].filter(Boolean).join(' · ')+kt}}
  const km=pn(w.km),mn=pn(w.min),parts=[];
  if(km)parts.push(`${num(km,2)} km`);if(mn)parts.push(fmtMin(mn));
  if(w.type==='run'&&km&&mn)parts.push(`${pace(mn/km)} /km`);
  if(w.type==='bike'&&km&&mn)parts.push(`${num(km/(mn/60),1)} km/h`);

  return{title:w.type==='other'?(w.name||'Altro'):TYPES[w.type].label,sub:(parts.join(' · ')||(w.note||''))+kt};
}

function rTStats(){
  const W=S.workouts;
  if(!W.length)return empty('Registra il primo allenamento dal calendario: qui vedrai medie, totali, progressi e record.');
  const ws=weekStart(new Date());
  const weeks=[];for(let i=11;i>=0;i--){const s=addDays(ws,-7*i),sk=ymd(s),ek=ymd(addDays(s,7));weeks.push({s,items:W.filter(w=>w.date>=sk&&w.date<ek)})}
  const firstD=W.map(w=>w.date).sort()[0];
  const nW=Math.min(12,Math.max(1,Math.round((ws-weekStart(parseYmd(firstD)))/(7*864e5))+1));
  const avg=weeks.slice(12-nW).reduce((a,w)=>a+w.items.length,0)/nW;
  let streak=0;
  for(let i=0;i<104;i++){const s=addDays(ws,-7*i),sk=ymd(s),ek=ymd(addDays(s,7));const n=W.filter(w=>w.date>=sk&&w.date<ek).length;
    if(n>=S.goals.weekly)streak++;else if(i>0)break;}

    <div class="stat"><small>Settimane a obiettivo</small><b>${streak} <em>di fila</em></b><em>obiettivo ${S.goals.weekly} a settimana</em></div>
    <div class="stat"><small>Questo mese</small><b>${W.filter(w=>w.date.startsWith(mk)).length} <em>allenamenti</em></b></div>
    <div class="stat"><small>Kcal bruciate</small><b>≈ ${num(last30.reduce((a,w)=>a+burn(w),0))}</b><em>ultimi 30 giorni, stima</em></div></div>`;
  const kgh=kmGoalHtml();if(kgh)h+=`<div class="card"><div class="small muted" style="margin-bottom:8px">Obiettivi del mese</div>${kgh}</div>`;
  h+=`<div class="card"><div class="small muted" style="margin-bottom:8px">Allenamenti per settimana</div>${weekChart(weeks,S.goals.weekly)}<div class="legend">${Object.values(TYPES).map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join('')}<span>┄ obiettivo</span></div></div>`;
  const rows=Object.entries(TYPES).map(([k,t])=>{
    const all=W.filter(w=>w.type===k);if(!all.length)return'';
    const l30=all.filter(w=>w.date>=since30),km=all.reduce((a,w)=>a+pn(w.km),0),mn=all.reduce((a,w)=>a+pn(w.min),0),kc=l30.reduce((a,w)=>a+burn(w),0);
    const elT=all.reduce((a,w)=>a+pn(w.elev),0),extra=((k==='run'||k==='bike')&&km?` · ${num(km,1)} km`:'')+(elT?` · ↑ ${num(elT)} m`:'');
    return `<div class="row"><span><i class="dot" style="background:${t.color}"></i>${t.label}<br><small class="muted">${all.length} in totale${extra}${mn?' · '+fmtMin(mn):''}</small></span><span>${l30.length}<br><small class="muted">30 gg${kc?' · ≈'+num(kc)+' kcal':''}</small></span></div>`;
  }).join('');
  h+=`<div class="section-h"><h3>Per attività</h3></div><div class="card">${rows}</div>`;
  const cardio=['run','bike'].map(k=>{const a=W.filter(w=>w.type===k&&pn(w.km)&&pn(w.min));if(!a.length)return'';
    const km=a.reduce((s,w)=>s+pn(w.km),0),mn=a.reduce((s,w)=>s+pn(w.min),0);

  const gym=W.filter(w=>w.type==='gym');
  if(gym.length&&S.plans.length){
    h+=`<div class="section-h"><h3>Schede</h3></div><div class="card">${S.plans.map(p=>{const g=gym.filter(w=>w.planId===p.id),last=g.map(w=>w.date).sort().pop();
      return `<div class="row"><span>${esc(p.name)}<br><small class="muted">${last?'ultima volta '+fmtShort(last):'mai fatta'}</small></span><span>${g.length}×</span></div>`}).join('')}</div>`;
  }
  const rec={};
  gym.forEach(w=>w.ex.forEach(e=>e.s.forEach(s=>{const kg=pn(s.kg);if(!kg||!e.name)return;const k=norm(e.name);if(!rec[k]||kg>rec[k].kg||(kg===rec[k].kg&&w.date>rec[k].date))rec[k]={name:e.name,kg,reps:s.r,date:w.date}})));

  return h;
}
function weekChart(weeks,goal){
  const W=320,H=150,pb=18,pt=8,max=Math.max(goal||0,...weeks.map(w=>w.items.length),1),bw=W/weeks.length,sc=(H-pb-pt)/max;
  let s='';
  weeks.forEach((w,i)=>{let y=H-pb;
    ['gym','run','bike','other'].forEach(tp=>{const n=w.items.filter(x=>x.type===tp).length;if(!n)return;const hh=n*sc;y-=hh;
      s+=`<rect x="${(i*bw+bw*.2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${Math.max(hh-1.5,1).toFixed(1)}" rx="2.5" style="fill:${TYPES[tp].color}"/>`});
    if(i%3===2||i===weeks.length-1)s+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${w.s.getDate()}/${w.s.getMonth()+1}</text>`;
  });
  if(goal){const gy=(H-pb-goal*sc).toFixed(1);s+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1"/>`}
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line);stroke-width:1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

      <div class="card">${[...ses].reverse().slice(0,20).map(s=>`<div class="row"><span>${fmtShort(s.date)}<br><small class="muted">${s.sets} serie · volume ${num(s.vol)} kg</small></span><span>${num(s.best.kg,1)} kg × ${num(s.best.r)}${s.orm?`<br><small class="muted" style="font-weight:500">1RM ≈ ${num(s.orm,1)}</small>`:''}</span></div>`).join('')}</div>

/* ---- GPX ---- */
function hav(a,b){const R=6371000,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lon-a.lon)*r,x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}

  const E=P.map(p=>p.ele),hasE=E.filter(isFinite).length>P.length*.8;let up=0,down=0,hi=null,lo=null,sm=[];
  if(hasE){sm=E.map((_,i)=>{let a=0,n=0;for(let j=Math.max(0,i-2);j<=Math.min(E.length-1,i+2);j++)if(isFinite(E[j])){a+=E[j];n++}return n?a/n:NaN});
    let ref=null;sm.forEach(e=>{if(!isFinite(e))return;if(ref==null){ref=e;return}if(e>ref+2){up+=e-ref;ref=e}else if(e<ref-2){down+=ref-e;ref=e}});

  /* campioni ridotti per altimetria e traccia */

  idx.forEach(i=>{track.push([+P[i].lat.toFixed(4),+P[i].lon.toFixed(4)]);if(hasE&&isFinite(sm[i]))profile.push([+(dist[i]/1000).toFixed(2),Math.round(sm[i])])});
  const hrs=P.map(p=>p.hr).filter(v=>v>30&&v<230);
  const tt=((doc.getElementsByTagName('type')[0]||{}).textContent||'').toLowerCase().trim();
  const type=/run|corsa|jog/.test(tt)||tt==='9'?'run':/ride|cycl|bik|bici/.test(tt)||tt==='1'?'bike':'';

/* ================= DIETA ================= */
function rDiet(){
  const s=U.sub.diet;
  return seg('diet',[['log','Diario'],['plan','Piano'],['body','Peso'],['foods','Alimenti']])+(s==='plan'?rDietPlan():s==='foods'?rFoods():s==='body'?rBody():rDietLog());

function dayLabel(k){const t=today();if(k===t)return'Oggi';if(k===ymd(addDays(new Date(),-1)))return'Ieri';if(k===ymd(addDays(new Date(),1)))return'Domani';return parseYmd(k).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
function rDietLog(){
  const D=U.dietDate,T=dayTotals(D),GF=goalFor(D),gk=GF.kcal,G=S.diet.goal,left=gk-T.kcal,en=T.p*4+T.c*4+T.f*9;
  const mac=(l,v,col,goal,mult)=>`<div class="macro"><div class="l"><span>${l}</span><span><b>${num(v)} g</b>${goal?` <span class="muted">/ ${num(goal)}</span>`:''}${en?` <span class="muted">· ${num(v*mult/en*100)}%</span>`:''}</span></div><div class="bar"><i style="width:${goal?Math.min(100,v/goal*100):(en?v*mult/en*100:0)}%;background:${col}"></i></div></div>`;

  h+=`<div class="card"><div class="ringwrap"><div class="ringlbl">${ringSvg(T.kcal,gk)}<div><b>${num(T.kcal)}</b><small>di ${num(gk)} kcal</small></div></div><div class="macros">
    <div class="small" style="margin-bottom:10px;font-weight:600">${left>=0?`Restano ${num(left)} kcal`:`<span class="neg">${num(-left)} kcal oltre l'obiettivo</span>`}</div>
    ${mac('Proteine',T.p,'var(--p)',pn(G.p),4)}${mac('Carboidrati',T.c,'var(--c)',0,4)}${mac('Grassi',T.f,'var(--f)',0,9)}</div></div>
    ${GF.train||GF.burn?`<div class="small muted" style="margin-top:10px">${GF.train?'<span class="tag">Giorno di allenamento</span> ':''}${GF.burn?`Attività: ≈ ${num(GF.burn)} kcal bruciate${G.addBurn?' (già sommate all\'obiettivo)':''}`:''}</div>`:''}
    ${waterRow(D)}</div>`;
  const hasPlan=MEALS.some(([k])=>S.diet.plan[k].length);

    return `<div class="card meal"><div class="mh"><div><b>${l}</b><span>${kc?num(kc)+' kcal':''}</span></div>${items.length?`<button class="plus star" data-a="saveFav" data-meal="${k}" aria-label="Salva come pasto preferito" title="Salva come preferito">★</button>`:''}<button class="plus" data-a="addFood" data-meal="${k}" aria-label="Aggiungi a ${l}">+</button></div>
      ${items.map(e=>`<button class="fi" data-a="editLog" data-id="${e.id}"><span>${esc(e.name)}<small>${e.g?num(e.g)+' g · ':''}P ${num(e.p)} · C ${num(e.c)} · G ${num(e.f)}</small></span><span class="k">${num(e.kcal)} kcal</span></button>`).join('')}</div>`}).join('');
  if(hasPlan)h+=`<button class="btn ghost" data-a="copyPlan">Copia il piano dieta su questo giorno</button>`;
  const days=[];for(let i=6;i>=0;i--){const k=ymd(addDays(parseYmd(D),-i));days.push({k,g:goalFor(k).kcal,...dayTotals(k)})}

function dayChart(days){
  const W=320,H=140,pb=18,pt=12,max=Math.max(...days.map(d=>Math.max(d.kcal,d.g*1.1)),1),bw=W/days.length,sc=(H-pb-pt)/max;

    const gy=(H-pb-d.g*sc).toFixed(1);s+=`<line x1="${(x+bw*.1).toFixed(1)}" x2="${(x+bw*.9).toFixed(1)}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:3 2"/>`;
    s+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${parseYmd(d.k).toLocaleDateString('it-IT',{weekday:'short'})}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg><div class="legend"><span>┄ obiettivo del giorno</span></div>`;
}

function favKcal(f){return f.items.reduce((a,it)=>a+(it.per?tot(it.per,it.g).kcal:pn(it.kcal)),0)}

  h+=`<p class="note">Oltre a questi, l'app contiene ${FOODS.length} alimenti comuni (valori medi indicativi per 100 g) e cerca i prodotti confezionati su Open Food Facts, anche con il codice a barre.</p>`;
  return h;

function recentFoods(){const seen=new Set(),out=[];for(let i=S.diet.log.length-1;i>=0&&out.length<12;i--){const e=S.diet.log[i];if(!e.per)continue;const k=norm(e.name);if(seen.has(k))continue;seen.add(k);out.push({name:e.name,...e.per,por:e.por||0,src:'rec'})}return out}
function mapOFF(p){const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
  const name=(p.product_name_it||p.product_name||'').trim();if(!name||k==null||isNaN(+k))return null;
  const r1=v=>Math.round((+v||0)*10)/10,br=(p.brands||'').split(',')[0].trim();
  return{name:br?`${name} (${br})`:name,k:Math.round(+k),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),f:r1(n.fat_100g),por:Math.round(+p.serving_quantity)||0,code:p.code||'',src:'off'}}
async function searchOFF(q){
  const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=code,product_name,product_name_it,brands,nutriments,serving_quantity`);
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return(j.products||[]).map(mapOFF).filter(Boolean);
}
async function offByCode(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=code,product_name,product_name_it,brands,nutriments,serving_quantity`);
  if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(!j||j.status!==1||!j.product)return null;return mapOFF({...j.product,code:j.product.code||code});
}
/* ---- scanner codice a barre (libreria ZXing, caricata solo quando serve) ---- */
let zxP=null;
function loadZX(){if(window.ZXing)return Promise.resolve();if(zxP)return zxP;zxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/zxing.min.js';s.onload=res;s.onerror=()=>{zxP=null;rej(new Error('load'))};document.head.appendChild(s)});return zxP}
function scanBarcode(){return new Promise(async resolve=>{
  const ov=$('#scan'),vid=$('#scanVid'),msg=$('#scanMsg');ov.hidden=false;msg.textContent='Inquadra il codice a barre';$('#scanCode').value='';
  let reader=null,finished=false;
  const done=code=>{if(finished)return;finished=true;try{reader&&reader.reset()}catch(e){}try{const st=vid.srcObject;if(st)st.getTracks().forEach(t=>t.stop());vid.srcObject=null}catch(e){}ov.hidden=true;resolve(code)};
  $('#scanX').onclick=()=>done(null);
  $('#scanGo').onclick=()=>{const c=$('#scanCode').value.replace(/\D/g,'');if(c.length>=6)done(c);else toast('Codice non valido')};
  try{await loadZX()}catch(e){msg.textContent='Scanner non disponibile senza connessione: scrivi il codice qui sotto';return}
  if(finished)return;
  try{const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    reader=new Z.BrowserMultiFormatReader(hints,150);
    await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},vid,r=>{if(r&&!finished){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}done(r.getText())}});
  }catch(e){if(!finished)msg.textContent='Fotocamera non disponibile: consenti l\'accesso alla fotocamera oppure scrivi il codice qui sotto'}
})}
function guessMeal(){const h=new Date().getHours();return h<11?'colazione':h<15?'pranzo':h<18?'spuntini':'cena'}

    render:d=>{
      if(d.pick==='manual'){const m=d.manual;
        return `<button class="btn ghost sm" data-s="back" style="margin-bottom:12px">‹ Cerca alimento</button>

        <div class="res" id="res">${results(d)}</div>

    },

      fav:v=>{const f=S.diet.favs.find(x=>x.id===v);if(!f)return false;
        f.items.forEach(it=>{if(mode==='plan'){if(it.per)S.diet.plan[d.meal].push({id:uid(),name:it.name,g:it.g,per:it.per,por:it.por||0})}

function rMore(){
  const standalone=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
  const lb=S.meta.lastBackup,days=lb?Math.floor((Date.now()-lb)/864e5):null;
  let h='';
  if(!standalone)h+=`<div class="banner"><b>Installa sull'iPhone</b><br>In Safari tocca <b>Condividi</b> → <b>Aggiungi alla schermata Home</b>. L'app si aprirà a tutto schermo e funzionerà anche offline.</div>`;
  h+=`<div class="section-h" style="margin-top:4px"><h3>Backup</h3></div><div class="card">
    <p class="small muted" style="margin:0 0 12px">I dati sono salvati solo su questo dispositivo. Fai un backup ogni tanto e salvalo su iCloud Drive o OneDrive.${lb?` Ultimo backup: <b>${days===0?'oggi':days===1?'ieri':days+' giorni fa'}</b>.`:' <b class="neg">Nessun backup ancora.</b>'}</p>
    <button class="btn" data-a="export">Esporta backup</button><button class="btn ghost" data-a="import">Ripristina da backup</button><button class="btn ghost" data-a="csv">Esporta movimenti in CSV (Excel)</button></div>`;
  const P=S.profile;h+=`<div class="section-h"><h3>Profilo per le stime</h3></div><div class="card"><div class="two"><label class="fld"><span>Sesso</span><select data-c="sex"><option value="">–</option><option value="M"${P.sex==='M'?' selected':''}>Uomo</option><option value="F"${P.sex==='F'?' selected':''}>Donna</option></select></label><label class="fld"><span>Anno di nascita</span><input data-c="birth" inputmode="numeric" value="${esc(P.birthYear)}" placeholder="es. 1990"></label></div><label class="fld" style="margin:0"><span>Peso della bici (kg)</span><input data-c="bikeKg" inputmode="decimal" value="${esc(P.bikeKg)}"></label><p class="note" style="margin:10px 4px 0">Sesso ed età servono solo per calcolare le kcal dalla frequenza cardiaca. Il peso corporeo lo prendo da Dieta → Peso.</p></div>`;
  h+=`<div class="section-h"><h3>Risparmi</h3></div><div class="card"><label class="fld" style="margin:0"><span>Saldo iniziale (quanto avevi già da parte)</span><input data-c="start" inputmode="decimal" value="${String(S.fin.start||'').replace('.',',')}" placeholder="0,00"></label></div>`;
  h+=`<div class="section-h"><h3>Dati</h3></div><div class="card">
    <div class="row"><span>Allenamenti</span><span>${S.workouts.length}</span></div><div class="row"><span>Movimenti</span><span>${S.fin.tx.length}</span></div><div class="row"><span>Voci diario alimentare</span><span>${S.diet.log.length}</span></div><div class="row"><span>Registrazioni peso</span><span>${S.body.log.length}</span></div><div class="row"><span>Spazio usato<br><small class="muted">il limite di Safari è circa 5 MB</small></span><span>${(()=>{let n=0;try{n=(localStorage.getItem(KEY)||'').length}catch(e){}return n>1e6?num(n/1048576,1)+' MB':num(n/1024)+' KB'})()}</span></div>
    <button class="btn danger" data-a="reset">Cancella tutti i dati</button></div>`;
  h+=`<p class="note" style="text-align:center">Routine · versione 2.1<br>Le kcal bruciate sono stime indicative basate sul tuo peso.</p>`;
  return h;
}
async function exportFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}

/* ================= azioni ================= */
const A={
  tab:o=>{U.tab=o.v;saveUI();render();window.scrollTo(0,0)},
  sub:o=>{U.sub[o.k]=o.v;saveUI();render()},
  mnav:o=>{const s=o.w==='cal'?U.cal:U.fin;const d=new Date(s.y,s.m+(+o.v),1);s.y=d.getFullYear();s.m=d.getMonth();render()},
  selDay:o=>{U.sel=o.d;const d=parseYmd(o.d);U.cal={y:d.getFullYear(),m:d.getMonth()};render()},
  addW:o=>openWorkout(null,o.d),
  editW:o=>openWorkout(o.id),
  startPlan:o=>openWorkout(null,today(),o.id),
  resumeW:()=>{const d=getDraft();if(d)openWorkout(null,null,null,d)},
  discardW:()=>{if(confirm('Scartare l\'allenamento in corso?')){setDraft(null);stopTimer();render()}},
  exProg:o=>openExProgress(o.n),
  goal:o=>{S.goals.weekly=Math.max(1,Math.min(14,S.goals.weekly+(+o.v)));save();render()},
  editPlan:o=>openPlan(o.id||null),
  startRoute:o=>openWorkout(null,today(),null,null,o.id),
  editRoute:o=>openRoute(o.id||null),
  addTx:()=>openTx(),
  editTx:o=>openTx(o.id),
  editRec:o=>openRec(o.id||null),
  editBudget:o=>openBudget(o.cat||null),
  editGoal:o=>openGoal(o.id||null),
  avgN:o=>{U.avgN=+o.v;saveUI();render()},
  dnav:o=>{U.dietDate=+o.v===0?today():ymd(addDays(parseYmd(U.dietDate),+o.v));render()},
  addFood:o=>openFoodPicker(o.mode||'log',o.meal),
  editLog:o=>openLogEntry(o.id),
  editPlanItem:o=>openPlanItem(o.meal,o.id),
  editCustom:o=>openCustomFood(o.id||null),
  editFav:o=>openFav(o.id),
  editBody:o=>openWeight(o.id),
  saveFav:o=>{const items=S.diet.log.filter(e=>e.date===U.dietDate&&e.meal===o.meal);if(!items.length)return;
    const lab=(MEALS.find(m=>m[0]===o.meal)||[,''])[1];const n=(prompt('Nome del pasto preferito',`${lab} solita`)||'').trim();if(!n)return;
    S.diet.favs.push({id:uid(),name:n,items:items.map(e=>({name:e.name,g:e.g,per:e.per,por:e.por||0,kcal:e.kcal,p:e.p,c:e.c,f:e.f}))});save();render();toast(`Salvato «${n}» tra i preferiti`)},
  water:o=>{const k=o.d||today();S.diet.water[k]=Math.max(0,(S.diet.water[k]||0)+(+o.v));save();render()},
  qa:o=>{if(o.v==='w')openWorkout(null,today());else if(o.v==='t')openTx();else if(o.v==='f'){U.dietDate=today();openFoodPicker('log')}else if(o.v==='p')openWeight()},
  goDiet:()=>{U.tab='diet';U.sub.diet='log';U.dietDate=today();saveUI();render();window.scrollTo(0,0)},
  goBody:()=>{U.tab='diet';U.sub.diet='body';saveUI();render();window.scrollTo(0,0)},
  copyPlan:()=>{const D=U.dietDate;if(S.diet.log.some(e=>e.date===D)&&!confirm('In questo giorno ci sono già alimenti. Aggiungo comunque quelli del piano?'))return;
    MEALS.forEach(([k])=>S.diet.plan[k].forEach(p=>S.diet.log.push({id:uid(),date:D,meal:k,name:p.name,g:p.g,per:p.per,por:p.por||0,...tot(p.per,p.g)})));save();render();toast('Piano copiato')},
  export:async()=>{const ok=await exportFile(`routine-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');if(ok){S.meta.lastBackup=Date.now();save();render();toast('Backup esportato')}},
  import:()=>$('#importFile').click(),
  csv:()=>{const rows=[['Data','Tipo','Categoria','Importo','Nota']].concat([...S.fin.tx].sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='inc'?'Entrata':'Uscita',t.cat,(t.type==='inc'?t.amt:-t.amt).toFixed(2).replace('.',','),t.note||'']));
    exportFile(`movimenti-${today()}.csv`,'﻿'+rows.map(r=>r.map(v=>/[;"\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(';')).join('\n'),'text/csv')},
  reset:()=>{if(confirm('Cancellare TUTTI i dati? Operazione irreversibile: fai prima un backup.')&&confirm('Sicuro?')){S=defaults();setDraft(null);save();render();toast('Dati cancellati')}}
};
const C={
  goalK:v=>{const n=Math.round(pn(v));if(n>0)S.diet.goal.kcal=n},
  goalKT:v=>{const n=Math.round(pn(v));S.diet.goal.kcalT=n>0?n:''},
  goalP:v=>{S.diet.goal.p=Math.round(pn(v))},
  goalW:v=>{const n=Math.round(pn(v));if(n>0)S.diet.goal.water=n},
  addBurn:v=>{S.diet.goal.addBurn=!!v},
  height:v=>{const n=Math.round(pn(v));S.body.height=n>0?n:''},
  start:v=>{S.fin.start=Math.round(pn(v)*100)/100},
  kmBike:v=>{const n=Math.round(pn(v));S.goals.kmBike=n>0?n:''},
  kmRun:v=>{const n=Math.round(pn(v));S.goals.kmRun=n>0?n:''},
  sex:v=>{S.profile.sex=v==='M'||v==='F'?v:''},
  birth:v=>{const n=Math.round(pn(v));S.profile.birthYear=n>1900&&n<=new Date().getFullYear()?n:''},
  bikeKg:v=>{const n=pn(v);S.profile.bikeKg=n>0?Math.round(n*10)/10:10}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.closest('#sheet'))return;const f=A[t.dataset.a];if(f)f(t.dataset,t)});
$('#view').addEventListener('change',e=>{const el=e.target,k=el.dataset.c;if(k&&C[k]){C[k](el.type==='checkbox'?el.checked:el.value);save();render();toast('Salvato')}});
$('#addBtn').addEventListener('click',()=>{
  if(U.tab==='train'){if(U.sub.train==='plans')openPlan(null);else if(U.sub.train==='routes')openRoute(null);else openWorkout(null,U.sub.train==='cal'?U.sel:today())}
  else if(U.tab==='fin'){if(U.sub.fin==='plan')openRec(null);else openTx()}
  else if(U.tab==='diet'){if(U.sub.diet==='foods')openCustomFood(null);else if(U.sub.diet==='body')openWeight();else openFoodPicker(U.sub.diet==='plan'?'plan':'log')}
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.plans||!d.fin||!d.diet)throw 0;if(!confirm('Sostituire i dati attuali con quelli del backup?'))return;S=migrate(merge(defaults(),d));save();applyRecurring();render();toast('Backup ripristinato')}catch(err){toast('File di backup non valido')}};r.readAsText(f)});

/* ================= pannello (sheet) ================= */
let SH=null;
function openSheet(o){SH=o;$('#shTitle').textContent=o.title;$('#shSave').textContent=o.saveLabel||'Salva';$('#shSave').style.visibility=o.noSave?'hidden':'visible';$('#shCancel').textContent=o.cancelLabel||'Annulla';$('#shBody').oninput=null;drawSheet();$('#sheet').hidden=false;document.body.classList.add('lock');$('#shBody').scrollTop=0}
function drawSheet(){if(!SH)return;const b=$('#shBody'),st=b.scrollTop;b.innerHTML=SH.render(SH.d)+(SH.onDelete?`<button class="btn danger" data-s="__del">${SH.delLabel||'Elimina'}</button>`:'');b.scrollTop=st;SH.live&&SH.live(SH.d,b)}
function closeSheet(){$('#sheet').hidden=true;SH=null;document.body.classList.remove('lock')}
function cancelSheet(){const s=SH;closeSheet();if(s&&s.onCancel)s.onCancel()}
$('#shBody').addEventListener('input',e=>{if(!SH)return;const el=e.target,d=SH.d;
  if(el.dataset.f)d[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;
  else if(el.dataset.e!=null){const ex=d.ex[+el.dataset.e];if(el.dataset.j!=null){const j=+el.dataset.j,k=el.dataset.k,old=String(ex.s[j][k]);ex.s[j][k]=el.value;/* aggiorna anche le serie successive non ancora fatte con lo stesso valore */for(let x=j+1;x<ex.s.length;x++){const v=String(ex.s[x][k]);if((v.trim()===''||v===old)&&!ex.s[x].ok){ex.s[x][k]=el.value;const inp=$('#shBody').querySelector(`input[data-e="${el.dataset.e}"][data-j="${x}"][data-k="${k}"]`);if(inp)inp.value=el.value}}}else ex[el.dataset.k]=el.value}
  SH.live&&SH.live(d,$('#shBody'));SH.onChange&&SH.onChange(d)});
$('#shBody').addEventListener('change',e=>{const el=e.target;if(!SH)return;if(el.type==='checkbox'&&el.dataset.f){SH.d[el.dataset.f]=el.checked;return}if(el.tagName==='SELECT'&&el.dataset.s){SH.act[el.dataset.s](el.value,el);drawSheet();SH&&SH.onChange&&SH.onChange(SH.d)}});
$('#shBody').addEventListener('click',e=>{const el=e.target.closest('[data-s]');if(!el||el.tagName==='SELECT'||!SH)return;e.preventDefault();
  if(el.dataset.s==='__del'){if(confirm(SH.delConfirm||'Eliminare?')){SH.onDelete();closeSheet();save();render()}return}
  const fn=SH.act&&SH.act[el.dataset.s];if(!fn)return;if(fn(el.dataset.v,el)!==false){drawSheet();SH&&SH.onChange&&SH.onChange(SH.d)}});
$('#shSave').addEventListener('click',()=>{if(SH&&SH.onSave&&SH.onSave(SH.d)!==false){closeSheet();save();render()}});
$('#shCancel').addEventListener('click',cancelSheet);
$('#shBd').addEventListener('click',cancelSheet);

applyRecurring();
render();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){applyRecurring();if(!SH)render();if(TM.int)tickTimer()}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
