<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Routine</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#ececf1;--text:#111114;--muted:#6e6e78;--line:rgba(0,0,0,.08);
  --acc:#5856d6;--gym:#5856d6;--run:#ff6b3d;--bike:#1fae74;--other:#e0a100;
  --inc:#1fae74;--exp:#e5484d;--p:#4f8ef7;--c:#f0a43a;--f:#d6589a;--segon:#fff;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000;--card:#1a1a1f;--card2:#2a2a31;--text:#f3f3f6;--muted:#9c9ca8;--line:rgba(255,255,255,.09);
  --acc:#7d7bff;--gym:#7d7bff;--run:#ff7d52;--bike:#2fc488;--other:#f2b62b;
  --inc:#2fc488;--exp:#ff5f63;--p:#6aa2ff;--c:#f5b44f;--f:#e772ad;--segon:#45454e;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;cursor:pointer}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
header.top h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-.02em}
.addBtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;padding:0 0 3px}
main{padding:0 16px 16px;max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:4px 0 14px}
.seg button{flex:1;border:0;background:none;color:var(--text);padding:7px 4px;border-radius:8px;font-size:14px;font-weight:500}
.seg button.on{background:var(--segon);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;min-width:0}
.stat small{color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.stat b{font-size:21px;font-weight:700;letter-spacing:-.01em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3 .stat b{font-size:15px;white-space:normal;overflow:visible}
.stat em{font-style:normal;font-size:12px;color:var(--muted)}
.hero small{color:var(--muted);font-size:13px}.hero b{display:block;font-size:32px;font-weight:800;letter-spacing:-.02em}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month-nav h3{margin:0;font-size:17px;font-weight:700;text-transform:capitalize}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:20px;line-height:1;padding:0 0 2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px;font-weight:600}
.day{aspect-ratio:1/1;border:0;background:none;border-radius:50%;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0;position:relative}
.day.out{opacity:.28}
.day.has span{font-weight:700}
.day.today span{color:var(--acc);font-weight:800}
.day.sel{background:var(--acc)}.day.sel span{color:#fff}
.dots{display:flex;gap:2px;height:6px}.dots i{width:6px;height:6px;border-radius:50%}
.day.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.section-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px;gap:10px}
.section-h h3{margin:0;font-size:18px;font-weight:700}
.section-h h3::first-letter{text-transform:uppercase}
.item{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:14px;margin-bottom:8px;width:100%;border:0;color:inherit;text-align:left}
.item .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:14px}
.item .t{flex:1;min-width:0}.item .t b{display:block;font-weight:600}
.item .t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .r{font-weight:600;white-space:nowrap}
.btn{border:0;background:var(--acc);color:#fff;padding:13px 16px;border-radius:12px;font-weight:600;font-size:15px;width:100%;display:block}
.btn.sm{width:auto;padding:8px 12px;font-size:14px;display:inline-block}
.btn.ghost{background:var(--card2);color:var(--acc)}
.btn.danger{background:none;color:var(--exp);margin-top:14px}
.btn+.btn{margin-top:8px}
.empty{color:var(--muted);text-align:center;padding:22px 12px;font-size:14px;background:var(--card);border-radius:14px;margin-bottom:8px}
.bar{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:4px}
.catrow{padding:10px 0;border-bottom:1px solid var(--line)}.catrow:last-child{border:0;padding-bottom:2px}.catrow:first-child{padding-top:2px}
.catrow .l{display:flex;justify-content:space-between;margin-bottom:6px;font-size:15px;gap:8px}
.catrow .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.row:last-child{border:0}.row>span:last-child{font-weight:600;text-align:right}
.muted{color:var(--muted)}.small{font-size:13px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart text{font-size:9px;fill:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.stepper{display:flex;align-items:center;gap:14px}.stepper b{font-size:22px;min-width:26px;text-align:center}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:118px;flex:none}.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ringlbl{position:relative;width:118px;flex:none}.ringlbl div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringlbl b{font-size:22px;font-weight:800}.ringlbl small{font-size:11px;color:var(--muted)}
.macros{flex:1;min-width:0}
.macro{margin-bottom:10px}.macro:last-child{margin:0}.macro .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.meal .mh{display:flex;justify-content:space-between;align-items:center}
.meal .mh b{font-size:16px}.meal .mh span{color:var(--muted);font-size:14px;margin-left:6px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;color:inherit;text-align:left;font-size:15px}
.fi small{display:block;color:var(--muted);font-size:12px}
.fi .k{white-space:nowrap;font-weight:600}
.plus{width:30px;height:30px;border-radius:50%;border:0;background:var(--card2);color:var(--acc);font-size:21px;line-height:1;padding:0 0 2px;flex:none}
.note{font-size:13px;color:var(--muted);margin:6px 4px 12px}
.banner{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.42);animation:fade .2s}
.sheet .panel{position:relative;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.2,1);width:100%;max-width:640px;margin:0 auto}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);gap:8px}
.sh button{background:none;border:0;color:var(--acc);font-size:16px;padding:0;min-width:64px;text-align:left}
.sh button.save{font-weight:700;text-align:right}
.sh b{font-size:16px;text-align:center;flex:1}
.sb{overflow-y:auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);-webkit-appearance:none;appearance:none;margin:0}
input[type=date]{min-height:45px;display:block}
input[type=checkbox]{width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto;flex:none;margin:0}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:64px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;margin:4px 4px 14px;font-size:15px}
.exhead,.exrow{display:grid;grid-template-columns:1fr 46px 56px 58px 26px;gap:5px;align-items:center}
.exhead{font-size:11px;color:var(--muted);padding:0 4px 4px;font-weight:600;text-transform:uppercase}
.exrow{margin-bottom:6px}.exrow input{padding:10px 6px;text-align:center}.exrow input:first-child{text-align:left;padding-left:10px}
.x{border:0;background:none;color:var(--muted);font-size:22px;padding:0;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.amount{font-size:34px !important;font-weight:700;text-align:center;padding:14px !important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.live{font-size:14px;color:var(--acc);margin:-4px 4px 12px;font-weight:600;min-height:1px}
.res .fi:first-child{border-top:0}
.src{font-size:10px;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--muted);margin-left:6px;vertical-align:1px;font-weight:600}
.picked{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.picked b{font-size:17px;display:block}
.totals{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--card);border-radius:14px;padding:12px 6px;margin-bottom:14px}
.totals b{display:block;font-size:18px}.totals small{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,34,.94);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
</style>
</head>

</div>

const $=s=>document.querySelector(s);

const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pn=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n||0);

const fmtMin=m=>{m=Math.round(m);if(!m)return'0 min';const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?' '+pad(r):''}`:`${r} min`};

function merge(base,d){
  if(!d||typeof d!=='object'||Array.isArray(d))return d===undefined?base:d;
  const o={...base};
  for(const k in d){o[k]=(base[k]&&typeof base[k]==='object'&&!Array.isArray(base[k]))?merge(base[k],d[k]):d[k]}
  return o;
}

function rTrain(){

function wByDate(){const m={};S.workouts.forEach(w=>(m[w.date]||(m[w.date]=[])).push(w));return m}
function sortedW(){return [...S.workouts].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0))}
function suggestNextPlan(){
  if(!S.plans.length)return null;
  const g=sortedW().find(w=>w.type==='gym'&&w.planId&&S.plans.some(p=>p.id===w.planId));
  if(!g)return S.plans[0];
  const i=S.plans.findIndex(p=>p.id===g.planId);return S.plans[(i+1)%S.plans.length];
}
function weekCount(){const k=ymd(weekStart(new Date()));const e=ymd(addDays(weekStart(new Date()),7));return S.workouts.filter(w=>w.date>=k&&w.date<e).length}
function wSummary(w){
  if(w.type==='gym'){const p=S.plans.find(p=>p.id===w.planId);return{title:p?p.name:'Sala pesi',sub:[`${w.ex.length} esercizi`,w.min?fmtMin(pn(w.min)):''].filter(Boolean).join(' · ')}}
  const km=pn(w.km),mn=pn(w.min);const parts=[];
  if(km)parts.push(`${num(km,2)} km`);if(mn)parts.push(fmtMin(mn));
  if(w.type==='run'&&km&&mn)parts.push(`${pace(mn/km)} /km`);
  if(w.type==='bike'&&km&&mn)parts.push(`${num(km/(mn/60),1)} km/h`);
  return{title:w.type==='other'?(w.name||'Altro'):TYPES[w.type].label,sub:parts.join(' · ')||(w.note||'')};
}
function wCard(w){

}
function rCal(){

  if(next)h+=`<button class="item" data-a="startPlan" data-id="${next.id}"><div class="ic" style="background:var(--gym)">▶</div><div class="t"><b>Prossima: ${esc(next.name)}</b><small>${esc(next.note||next.ex.length+' esercizi')} · tocca per registrarla oggi</small></div></button>`;

  const list=(map[U.sel]||[]);
  h+=`<div class="section-h"><h3>${fmtLong(U.sel)}</h3><button class="btn sm" data-a="addW" data-d="${U.sel}">+ Aggiungi</button></div>`;
  h+=list.length?list.map(wCard).join(''):empty('Nessun allenamento in questo giorno');

function rTStats(){
  const W=S.workouts;
  if(!W.length)return empty('Registra il primo allenamento dal calendario: qui vedrai medie, totali e record.');
  const ws=weekStart(new Date());
  const weeks=[];for(let i=11;i>=0;i--){const s=addDays(ws,-7*i),sk=ymd(s),ek=ymd(addDays(s,7));weeks.push({s,items:W.filter(w=>w.date>=sk&&w.date<ek)})}
  const firstD=W.map(w=>w.date).sort()[0];
  const nW=Math.min(12,Math.max(1,Math.round((ws-weekStart(parseYmd(firstD)))/(7*864e5))+1));
  const avg=weeks.slice(12-nW).reduce((a,w)=>a+w.items.length,0)/nW;
  // serie di settimane con obiettivo raggiunto
  let streak=0;
  for(let i=0;i<104;i++){const s=addDays(ws,-7*i),sk=ymd(s),ek=ymd(addDays(s,7));const n=W.filter(w=>w.date>=sk&&w.date<ek).length;
    if(n>=S.goals.weekly)streak++;else if(i>0)break;}
  const mk=today().slice(0,7);
  let h=`<div class="grid2">
    <div class="stat"><small>Media settimanale</small><b>${num(avg,1)} <em>/ sett.</em></b><em>ultime ${nW} settimane</em></div>
    <div class="stat"><small>Settimane a obiettivo</small><b>${streak} <em>di fila</em></b><em>obiettivo ${S.goals.weekly} a settimana</em></div>
    <div class="stat"><small>Questo mese</small><b>${W.filter(w=>w.date.startsWith(mk)).length}</b></div>
    <div class="stat"><small>Totale</small><b>${W.length}</b></div></div>`;
  h+=`<div class="card"><div class="small muted" style="margin-bottom:8px">Allenamenti per settimana</div>${weekChart(weeks,S.goals.weekly)}<div class="legend">${Object.values(TYPES).map(t=>`<span><i style="background:${t.color}"></i>${t.label}</span>`).join('')}<span>┄ obiettivo</span></div></div>`;
  // per tipo
  const since30=ymd(addDays(new Date(),-29));
  const rows=Object.entries(TYPES).map(([k,t])=>{
    const all=W.filter(w=>w.type===k);if(!all.length)return'';
    const last=all.filter(w=>w.date>=since30);
    const km=all.reduce((a,w)=>a+pn(w.km),0),mn=all.reduce((a,w)=>a+pn(w.min),0);
    const extra=(k==='run'||k==='bike')&&km?` · ${num(km,1)} km`:'';
    return `<div class="row"><span><i class="dot" style="background:${t.color}"></i>${t.label}<br><small class="muted">${all.length} in totale${extra}${mn?' · '+fmtMin(mn):''}</small></span><span>${last.length}<br><small class="muted">ultimi 30 gg</small></span></div>`;
  }).join('');
  h+=`<div class="section-h"><h3>Per attività</h3></div><div class="card">${rows}</div>`;
  // corsa e bici: medie
  const cardio=['run','bike'].map(k=>{const a=W.filter(w=>w.type===k&&pn(w.km)&&pn(w.min));if(!a.length)return'';
    const km=a.reduce((s,w)=>s+pn(w.km),0),mn=a.reduce((s,w)=>s+pn(w.min),0);
    return `<div class="row"><span>${TYPES[k].label}: distanza media</span><span>${num(km/a.length,1)} km</span></div><div class="row"><span>${TYPES[k].label}: ${k==='run'?'passo medio':'velocità media'}</span><span>${k==='run'?pace(mn/km)+' /km':num(km/(mn/60),1)+' km/h'}</span></div>`}).join('');
  if(cardio)h+=`<div class="card">${cardio}</div>`;
  // schede
  const gym=W.filter(w=>w.type==='gym');
  if(gym.length&&S.plans.length){
    h+=`<div class="section-h"><h3>Schede</h3></div><div class="card">${S.plans.map(p=>{const g=gym.filter(w=>w.planId===p.id);const last=g.map(w=>w.date).sort().pop();
      return `<div class="row"><span>${esc(p.name)}<br><small class="muted">${last?'ultima volta '+fmtShort(last):'mai fatta'}</small></span><span>${g.length}×</span></div>`}).join('')}</div>`;
  }
  // record
  const rec={};
  gym.forEach(w=>w.ex.forEach(e=>{const kg=pn(e.kg);if(!kg||!e.name)return;const k=norm(e.name);if(!rec[k]||kg>rec[k].kg||(kg===rec[k].kg&&w.date>rec[k].date))rec[k]={name:e.name,kg,reps:e.reps,date:w.date}}));
  const rl=Object.values(rec).sort((a,b)=>a.name.localeCompare(b.name));
  if(rl.length)h+=`<div class="section-h"><h3>Carichi massimi</h3></div><div class="card">${rl.map(r=>`<div class="row"><span>${esc(r.name)}<br><small class="muted">${fmtShort(r.date)}${r.reps?' · '+esc(r.reps)+' rip':''}</small></span><span>${num(r.kg,1)} kg</span></div>`).join('')}</div>`;
  return h;
}
function weekChart(weeks,goal){
  const W=320,H=150,pb=18,pt=8,max=Math.max(goal||0,...weeks.map(w=>w.items.length),1),bw=W/weeks.length,sc=(H-pb-pt)/max;
  let s='';
  weeks.forEach((w,i)=>{let y=H-pb;
    ['gym','run','bike','other'].forEach(tp=>{const n=w.items.filter(x=>x.type===tp).length;if(!n)return;const hh=n*sc;y-=hh;
      s+=`<rect x="${(i*bw+bw*.2).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.6).toFixed(1)}" height="${Math.max(hh-1.5,1).toFixed(1)}" rx="2.5" style="fill:${TYPES[tp].color}"/>`});
    if(i%3===2||i===weeks.length-1)s+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${w.s.getDate()}/${w.s.getMonth()+1}</text>`;
  });
  if(goal){const gy=(H-pb-goal*sc).toFixed(1);s+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1"/>`}
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line);stroke-width:1"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

function lastEx(name,excludeId){
  const k=norm(name);
  for(const w of sortedW()){if(w.type!=='gym'||w.id===excludeId)continue;const e=w.ex.find(e=>norm(e.name)===k&&e.kg!=='');if(e)return e}
  return null;
}
function applyPlan(d,pid){
  d.planId=pid;const p=S.plans.find(p=>p.id===pid);if(!p)return;

/* ================= RISPARMI ================= */
function catColor(c){const all=[...S.fin.expCats,...S.fin.incCats.map(x=>'+'+x)];let i=S.fin.expCats.indexOf(c);if(i<0)i=all.length+Math.abs([...c].reduce((a,ch)=>a+ch.charCodeAt(0),0));return PALETTE[i%PALETTE.length]}
function txMonth(k){return S.fin.tx.filter(t=>t.date.startsWith(k))}
function sums(list){let inc=0,exp=0;const cats={},icats={};list.forEach(t=>{if(t.type==='inc'){inc+=t.amt;icats[t.cat]=(icats[t.cat]||0)+t.amt}else{exp+=t.amt;cats[t.cat]=(cats[t.cat]||0)+t.amt}});return{inc,exp,cats,icats}}
function rFin(){
  const s=U.sub.fin;
  return seg('fin',[['sum','Riepilogo'],['list','Movimenti'],['avg','Medie']])+(s==='list'?rFinList():s==='avg'?rFinAvg():rFinSum());
}
function catRow(c,v,exp,inc){const pe=exp?v/exp*100:0,col=catColor(c);
  return `<div class="catrow"><div class="l"><span><i class="dot" style="background:${col}"></i>${esc(c)}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${pe.toFixed(1)}%;background:${col}"></i></div><div class="sub"><span>${num(pe,1)}% delle spese</span>${inc?`<span>${num(v/inc*100,1)}% delle entrate</span>`:''}</div></div>`}
function rFinSum(){
  const k=monthKey(U.fin.y,U.fin.m),{inc,exp,cats}=sums(txMonth(k)),sav=inc-exp;
  const bal=pn(S.fin.start)+S.fin.tx.reduce((a,t)=>a+(t.type==='inc'?t.amt:-t.amt),0);
  let h=`<div class="card hero"><small>Risparmi totali</small><b class="${bal<0?'neg':''}">${eur(bal)}</b><small>saldo iniziale + entrate − uscite registrate</small></div>`;
  h+=monthNav('fin',U.fin);
  h+=`<div class="grid3"><div class="stat"><small>Entrate</small><b class="pos">${eur(inc)}</b></div><div class="stat"><small>Uscite</small><b class="neg">${eur(exp)}</b></div><div class="stat"><small>Risparmiato</small><b>${eur(sav)}</b><em>${inc?num(sav/inc*100)+'% delle entrate':'–'}</em></div></div>`;
  if(inc){const pct=exp/inc*100;h+=`<div class="card"><div class="catrow" style="padding:0"><div class="l"><span>Hai speso il <b>${num(pct)}%</b> di quello che hai guadagnato</span></div><div class="bar"><i style="width:${Math.min(100,pct).toFixed(1)}%;background:${pct>100?'var(--exp)':pct>85?'var(--c)':'var(--inc)'}"></i></div></div></div>`}
  const list=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  h+=`<div class="section-h"><h3>Dove vanno i soldi</h3><button class="btn sm" data-a="addTx">+ Movimento</button></div>`;
  h+=list.length?`<div class="card">${list.map(([c,v])=>catRow(c,v,exp,inc)).join('')}</div>`:empty('Nessuna spesa in questo mese. Aggiungi stipendio e spese con il tasto +.');
  return h;
}
function txRow(t){const col=t.type==='inc'?'var(--inc)':catColor(t.cat);
  return `<button class="item" data-a="editTx" data-id="${t.id}"><div class="ic" style="background:${col}">${esc(t.cat.slice(0,2).toUpperCase())}</div><div class="t"><b>${esc(t.cat)}</b><small>${esc(t.note||fmtShort(t.date))}</small></div><span class="r ${t.type==='inc'?'pos':''}">${t.type==='inc'?'+':'−'}${eur(t.amt)}</span></button>`}
function rFinList(){
  const k=monthKey(U.fin.y,U.fin.m),list=txMonth(k).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  let h=monthNav('fin',U.fin);
  if(!list.length)return h+empty('Nessun movimento in questo mese');
  let cur='';list.forEach(t=>{if(t.date!==cur){cur=t.date;h+=`<div class="small muted" style="margin:14px 4px 6px;text-transform:capitalize">${fmtLong(t.date)}</div>`}h+=txRow(t)});
  return h;
}
function rFinAvg(){
  if(!S.fin.tx.length)return empty('Registra entrate e spese per qualche mese: qui vedrai quanto spendi in media per ogni categoria.');
  const firstM=S.fin.tx.map(t=>t.date.slice(0,7)).sort()[0],now=new Date(),curM=monthKey(now.getFullYear(),now.getMonth());
  let months=[];for(let i=U.avgN;i>=1;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=monthKey(d.getFullYear(),d.getMonth());if(k>=firstM)months.push(k)}
  let note=`Media sugli ultimi ${months.length} mesi completi (il mese in corso è escluso).`;
  if(!months.length){months=[curM];note='Non c\'è ancora un mese completo: per ora la media usa il mese in corso.'}
  const n=months.length,per=months.map(k=>({k,...sums(txMonth(k))}));
  const inc=per.reduce((a,m)=>a+m.inc,0)/n,exp=per.reduce((a,m)=>a+m.exp,0)/n,sav=inc-exp;
  const cats={};per.forEach(m=>Object.entries(m.cats).forEach(([c,v])=>cats[c]=(cats[c]||0)+v));
  const list=Object.entries(cats).map(([c,v])=>[c,v/n]).sort((a,b)=>b[1]-a[1]);
  let h=`<div class="seg">${[3,6,12].map(x=>`<button data-a="avgN" data-v="${x}" class="${U.avgN===x?'on':''}">${x} mesi</button>`).join('')}</div>`;
  h+=`<div class="grid3"><div class="stat"><small>Entrate / mese</small><b class="pos">${eur(inc)}</b></div><div class="stat"><small>Uscite / mese</small><b class="neg">${eur(exp)}</b></div><div class="stat"><small>Risparmio / mese</small><b>${eur(sav)}</b><em>${inc?num(sav/inc*100)+'%':'–'}</em></div></div>`;
  h+=`<p class="note">${note}</p>`;
  h+=`<div class="card"><div class="small muted" style="margin-bottom:8px">Entrate e uscite per mese</div>${monthChart(per)}<div class="legend"><span><i style="background:var(--inc)"></i>Entrate</span><span><i style="background:var(--exp)"></i>Uscite</span></div></div>`;
  h+=`<div class="section-h"><h3>Spesa media per categoria</h3></div>`;
  h+=list.length?`<div class="card">${list.map(([c,v])=>catRow(c,v,exp,inc)).join('')}</div>`:empty('Nessuna spesa nel periodo');
  return h;
}
function monthChart(per){
  const W=320,H=150,pb=18,pt=8,max=Math.max(1,...per.map(m=>Math.max(m.inc,m.exp))),gw=W/per.length,sc=(H-pb-pt)/max,bw=Math.min(18,gw*.32);
  let s='';
  per.forEach((m,i)=>{const cx=i*gw+gw/2;
    [[m.inc,'var(--inc)',-1],[m.exp,'var(--exp)',1]].forEach(([v,c,dir])=>{const hh=v*sc;if(hh<=0)return;s+=`<rect x="${(cx+(dir<0?-bw-1:1)).toFixed(1)}" y="${(H-pb-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2.5" style="fill:${c}"/>`});
    const [y,mo]=m.k.split('-');s+=`<text x="${cx.toFixed(1)}" y="${H-4}" text-anchor="middle">${MONTHS[+mo-1].slice(0,3)}</text>`});
  s+=`<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--line)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

/* ================= DIETA ================= */
const tot=(per,g)=>({kcal:per.k*g/100,p:per.p*g/100,c:per.c*g/100,f:per.f*g/100});
function dayTotals(date){return S.diet.log.filter(e=>e.date===date).reduce((a,e)=>({kcal:a.kcal+e.kcal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{kcal:0,p:0,c:0,f:0})}
function rDiet(){
  const s=U.sub.diet;
  return seg('diet',[['log','Diario'],['plan','Piano'],['foods','Alimenti']])+(s==='plan'?rDietPlan():s==='foods'?rFoods():rDietLog());
}
function dayLabel(k){const t=today();if(k===t)return'Oggi';if(k===ymd(addDays(new Date(),-1)))return'Ieri';if(k===ymd(addDays(new Date(),1)))return'Domani';return parseYmd(k).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}
function ringSvg(val,goal){
  const r=50,c=2*Math.PI*r,p=goal?Math.min(val/goal,1):0,over=goal&&val>goal;
  return `<svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" style="stroke:var(--card2)"/>${p>0?`<circle cx="60" cy="60" r="${r}" transform="rotate(-90 60 60)" style="stroke:${over?'var(--exp)':'var(--run)'};stroke-dasharray:${(c*p).toFixed(1)} ${c.toFixed(1)}"/>`:''}</svg>`;
}
function rDietLog(){
  const D=U.dietDate,T=dayTotals(D),G=S.diet.goal,left=G.kcal-T.kcal,en=T.p*4+T.c*4+T.f*9;
  const mac=(l,v,col,goal)=>`<div class="macro"><div class="l"><span>${l}</span><span><b>${num(v)} g</b>${goal?` <span class="muted">/ ${goal}</span>`:''}${en?` <span class="muted">· ${num((l==='Grassi'?v*9:v*4)/en*100)}%</span>`:''}</span></div><div class="bar"><i style="width:${goal?Math.min(100,v/goal*100):(en?(l==='Grassi'?v*9:v*4)/en*100:0)}%;background:${col}"></i></div></div>`;
  let h=`<div class="month-nav"><button class="icon-btn" data-a="dnav" data-v="-1">‹</button><h3 data-a="dnav" data-v="0">${dayLabel(D)}</h3><button class="icon-btn" data-a="dnav" data-v="1">›</button></div>`;
  h+=`<div class="card ringwrap"><div class="ringlbl">${ringSvg(T.kcal,G.kcal)}<div><b>${num(T.kcal)}</b><small>di ${num(G.kcal)} kcal</small></div></div><div class="macros">
    <div class="small" style="margin-bottom:10px;font-weight:600">${left>=0?`Restano ${num(left)} kcal`:`<span class="neg">${num(-left)} kcal oltre l'obiettivo</span>`}</div>
    ${mac('Proteine',T.p,'var(--p)',G.p)}${mac('Carboidrati',T.c,'var(--c)')}${mac('Grassi',T.f,'var(--f)')}</div></div>`;
  const hasPlan=MEALS.some(([k])=>S.diet.plan[k].length);
  h+=MEALS.map(([k,l])=>{const items=S.diet.log.filter(e=>e.date===D&&e.meal===k);const kc=items.reduce((a,e)=>a+e.kcal,0);
    return `<div class="card meal"><div class="mh"><div><b>${l}</b><span>${kc?num(kc)+' kcal':''}</span></div><button class="plus" data-a="addFood" data-meal="${k}" aria-label="Aggiungi a ${l}">+</button></div>
      ${items.map(e=>`<button class="fi" data-a="editLog" data-id="${e.id}"><span>${esc(e.name)}<small>${e.g?num(e.g)+' g · ':''}P ${num(e.p)} · C ${num(e.c)} · G ${num(e.f)}</small></span><span class="k">${num(e.kcal)} kcal</span></button>`).join('')}</div>`}).join('');
  if(hasPlan)h+=`<button class="btn ghost" data-a="copyPlan">Copia il piano dieta su questo giorno</button>`;
  // ultimi 7 giorni
  const days=[];for(let i=6;i>=0;i--){const k=ymd(addDays(parseYmd(D),-i));days.push({k,...dayTotals(k)})}
  const logged=days.filter(x=>x.kcal>0);
  if(logged.length){const avg=logged.reduce((a,x)=>a+x.kcal,0)/logged.length,avgP=logged.reduce((a,x)=>a+x.p,0)/logged.length;
    h+=`<div class="section-h"><h3>Ultimi 7 giorni</h3></div><div class="grid2"><div class="stat"><small>Media kcal</small><b>${num(avg)}</b><em>su ${logged.length} giorni registrati</em></div><div class="stat"><small>Media proteine</small><b>${num(avgP)} g</b></div></div><div class="card">${dayChart(days,G.kcal)}</div>`}
  return h;
}
function dayChart(days,goal){
  const W=320,H=140,pb=18,pt=8,max=Math.max(goal*1.15,...days.map(d=>d.kcal),1),bw=W/days.length,sc=(H-pb-pt)/max;
  let s='';
  days.forEach((d,i)=>{const hh=d.kcal*sc;if(hh>0)s+=`<rect x="${(i*bw+bw*.22).toFixed(1)}" y="${(H-pb-hh).toFixed(1)}" width="${(bw*.56).toFixed(1)}" height="${hh.toFixed(1)}" rx="3" style="fill:${d.kcal>goal?'var(--exp)':'var(--run)'}"/>`;
    s+=`<text x="${(i*bw+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${parseYmd(d.k).toLocaleDateString('it-IT',{weekday:'short'})}</text>`});
  const gy=(H-pb-goal*sc).toFixed(1);s+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" style="stroke:var(--muted);stroke-dasharray:3 3"/><text x="${W}" y="${gy-3}" text-anchor="end">obiettivo ${num(goal)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
function rDietPlan(){
  const G=S.diet.goal;
  let h=`<div class="card"><div class="small muted" style="margin-bottom:8px">Obiettivi giornalieri</div><div class="two"><label class="fld" style="margin:0"><span>Calorie (kcal)</span><input data-c="goalK" inputmode="numeric" value="${G.kcal}"></label><label class="fld" style="margin:0"><span>Proteine (g)</span><input data-c="goalP" inputmode="numeric" value="${G.p}"></label></div></div>`;
  let dayK=0,dayP=0;
  h+=MEALS.map(([k,l])=>{const items=S.diet.plan[k];const kc=items.reduce((a,e)=>a+tot(e.per,e.g).kcal,0);dayK+=kc;dayP+=items.reduce((a,e)=>a+tot(e.per,e.g).p,0);
    return `<div class="card meal"><div class="mh"><div><b>${l}</b><span>${kc?num(kc)+' kcal':''}</span></div><button class="plus" data-a="addFood" data-meal="${k}" data-mode="plan">+</button></div>
    ${items.map(e=>`<button class="fi" data-a="editPlanItem" data-meal="${k}" data-id="${e.id}"><span>${esc(e.name)}<small>${num(e.g)} g</small></span><span class="k">${num(tot(e.per,e.g).kcal)} kcal</span></button>`).join('')}</div>`}).join('');
  h=h.replace('</div></div>',`</div></div><div class="grid2"><div class="stat"><small>Totale piano</small><b>${num(dayK)} <em>kcal</em></b><em>obiettivo ${num(G.kcal)}</em></div><div class="stat"><small>Proteine piano</small><b>${num(dayP)} <em>g</em></b><em>obiettivo ${num(G.p)} g</em></div></div>`);
  h+=`<p class="note">Il piano è la tua giornata tipo. Dal Diario puoi copiarlo su un giorno con un tocco e poi modificare solo quello che cambia.</p>`;
  return h;
}
function rFoods(){
  let h=`<div class="section-h" style="margin-top:4px"><h3>I miei alimenti</h3><button class="btn sm" data-a="editCustom" data-id="">+ Nuovo</button></div>`;
  h+=S.diet.foods.length?`<div class="card">${[...S.diet.foods].sort((a,b)=>a.name.localeCompare(b.name)).map(f=>`<button class="fi" data-a="editCustom" data-id="${f.id}"><span>${esc(f.name)}<small>P ${num(f.p,1)} · C ${num(f.c,1)} · G ${num(f.f,1)} per 100 g</small></span><span class="k">${num(f.k)} kcal</span></button>`).join('')}</div>`:empty('Qui finiscono gli alimenti che crei tu e quelli trovati online che usi.');

function recentFoods(){const seen=new Set(),out=[];for(let i=S.diet.log.length-1;i>=0&&out.length<12;i--){const e=S.diet.log[i];if(!e.per)continue;const k=norm(e.name);if(seen.has(k))continue;seen.add(k);out.push({name:e.name,...e.per,por:e.por||0,src:'rec'})}return out}
async function searchOFF(q){
  const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=25&fields=product_name,product_name_it,brands,nutriments,serving_quantity`;
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
  const r1=v=>Math.round((+v||0)*10)/10;
  return(j.products||[]).map(p=>{const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;
    const name=(p.product_name_it||p.product_name||'').trim();if(!name||k==null||isNaN(+k))return null;
    const br=(p.brands||'').split(',')[0].trim();
    return{name:br?`${name} (${br})`:name,k:Math.round(+k),p:r1(n.proteins_100g),c:r1(n.carbohydrates_100g),f:r1(n.fat_100g),por:Math.round(+p.serving_quantity)||0,src:'off'}}).filter(Boolean);
}

async function exportFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
